services:
  qdrant:
    image: qdrant/qdrant:latest
    container_name: nexo-qdrant
    restart: unless-stopped
    volumes:
      - qdrant-data:/qdrant/storage

  nexo-chat:
    build: .
    container_name: nexo-chat
    restart: unless-stopped
    ports:
      - "8787:8787"
    environment:
      NEXO_DATA_DIR: /data
      NEXO_MAX_UPLOAD_MB: "15"
      NEXO_MAX_TOOL_OUTPUT_CHARS: "12000"
      NEXO_EMBEDDING_BASE_URL: "${NEXO_EMBEDDING_BASE_URL:-}"
      NEXO_EMBEDDING_API_KEY: "${NEXO_EMBEDDING_API_KEY:-}"
      NEXO_EMBEDDING_MODEL: "${NEXO_EMBEDDING_MODEL:-embedding-model}"
      NEXO_EMBEDDING_TIMEOUT: "${NEXO_EMBEDDING_TIMEOUT:-30}"
      NEXO_EMBEDDING_BATCH_SIZE: "${NEXO_EMBEDDING_BATCH_SIZE:-32}"
      NEXO_VECTOR_STORE: "${NEXO_VECTOR_STORE:-qdrant}"
      NEXO_QDRANT_URL: "${NEXO_QDRANT_URL:-http://qdrant:6333}"
      NEXO_QDRANT_API_KEY: "${NEXO_QDRANT_API_KEY:-}"
      NEXO_QDRANT_COLLECTION: "${NEXO_QDRANT_COLLECTION:-nexo_chunks}"
      # Enable optional modules with: attachments,web-search-searxng,decision-runtime
      NEXO_MODULES: "attachments"
      # Required only when web-search-searxng is enabled.
      # NEXO_SEARXNG_URL: "http://searxng:8080"
      # NEXO_SEARXNG_LANGUAGE: "all"
      # NEXO_SEARXNG_SAFESEARCH: "1"
      # NEXO_SEARXNG_MAX_RESULTS: "5"
      # NEXO_SEARXNG_TIMEOUT: "10"
      # NEXO_TOOL_CALLING_FALLBACK: "false"
      # NEXO_DECISION_PROVIDER: "arbiter"
      # NEXO_ARBITER_URL: "http://arbiter:8000"
      # NEXO_ARBITER_API_KEY: ""
      # NEXO_DECISION_MODEL: "jev-latest"
      # NEXO_DECISION_TIMEOUT: "10"
      # NEXO_DECISION_SHADOW: "false"
    volumes:
      - nexo-data:/data
    depends_on:
      - qdrant
    mem_limit: 768m
    cpus: 1.0

volumes:
  nexo-data:
  qdrant-data:
